! SYNTHETIC Cisco IOS configuration — SW-CORE-B (Catalyst 9300) — Property B (Airport)
hostname SW-CORE-B
!
spanning-tree mode rapid-pvst
spanning-tree vlan 1-4094 priority 4096
!
vlan 12
 name STAFF
vlan 22
 name GUEST
vlan 30
 name VOICE
vlan 60
 name POS
vlan 90
 name MGMT
!
interface Vlan90
 description Management SVI
 ip address 10.30.0.2 255.255.255.0
!
interface GigabitEthernet1/0/1
 description Trunk to SW-ACCESS-B1
 switchport mode trunk
 switchport trunk allowed vlan 12,22,30,60,90
!
interface GigabitEthernet1/0/5
 description IP Phone + PC - Gate 12
 switchport mode access
 switchport access vlan 12
 switchport voice vlan 30
 spanning-tree portfast
!
interface GigabitEthernet1/0/10
 description POS Terminal - Duty Free
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface GigabitEthernet1/0/11
 description POS Terminal - Cafe
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast
 spanning-tree bpduguard enable
!
end
