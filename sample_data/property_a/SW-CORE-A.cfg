! SYNTHETIC Cisco IOS configuration — SW-CORE-A (Catalyst 9300) — Property A
hostname SW-CORE-A
!
spanning-tree mode rapid-pvst
spanning-tree vlan 1-4094 priority 4096
!
vlan 10
 name STAFF
vlan 20
 name GUEST
vlan 30
 name VOICE
vlan 55
 name POS
vlan 90
 name MGMT
!
interface Vlan90
 description Management SVI
 ip address 10.20.0.2 255.255.255.0
!
interface Port-channel1
 description Uplink EtherChannel to SW-DIST-A
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,55,90
!
interface GigabitEthernet1/0/1
 description Trunk to SW-ACCESS-A1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,55,90
!
interface GigabitEthernet1/0/10
 description POS Terminal - Front Desk
 switchport mode access
 switchport access vlan 55
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface GigabitEthernet1/0/11
 description POS Terminal - Restaurant
 switchport mode access
 switchport access vlan 55
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface GigabitEthernet1/0/20
 description Staff Workstation
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface range GigabitEthernet1/0/23 - 24
 description EtherChannel member to SW-DIST-A
 channel-group 1 mode active
 switchport mode trunk
!
end
